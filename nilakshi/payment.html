<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Payment - AutoCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AutoCare Service</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Service</a>
            <a href="payment.html">Online Payment</a>
            <a href="about.html">About</a>
            <a href="admin_login.php">Admin Login</a>
        </nav>
    </header>

    <div class="container">
        <h2>Online Payment</h2>
        <p style="margin-top: 8px; color:#475569;"><strong>Payable Amount:</strong> <span id="display_amount">Rs. 0.00</span></p>
        <br>

        <form id="paymentForm">
            <div class="form-group">
                <label>Booking ID:</label>
                <input type="number" name="booking_id" id="booking_id" required placeholder="e.g., 1">
            </div>

            <div class="form-group">
                <label>Payment Method:</label>
                <select name="payment_method" id="payment_method">
                    <option value="Credit/Debit Card">Credit / Debit Card (Visa / Master)</option>
                    <option value="Online Bank Transfer">Online Bank Transfer</option>
                    <option value="Cash at Center">Pay at Service Center</option>
                </select>
            </div>

            <div id="cardFields">
                <div class="form-group">
                    <label>Card Number:</label>
                    <input type="text" name="card_number" id="card_number" placeholder="4532 1234 5678 9010">
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label>Expiry Date (MM/YY):</label>
                        <input type="text" name="expiry" id="expiry" placeholder="12/28">
                    </div>
                    <div class="form-group">
                        <label>CVV:</label>
                        <input type="password" name="cvv" id="cvv" placeholder="123">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success">Pay Now</button>
        </form>

        <div id="paymentResult" class="alert-box" style="display:none;"></div>
    </div>

    <footer>
        <p>&copy; 2026 AutoCare Vehicle Service Center.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
